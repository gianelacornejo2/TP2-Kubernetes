apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pacman
  labels:
    app: {{ .Release.Name }}-pacman
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pacman
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pacman
    spec:
      containers:
        - name: pacman
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
