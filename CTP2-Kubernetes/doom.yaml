apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom-deployment
  labels:
    app: doom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doom
  template:
    metadata:
      labels:
        app: doom
    spec:
      containers:
      - name: doom
        image: elliottking/doom-wasm:0.1.1
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: doom-service
  labels:
    app: doom
spec:
  type: NodePort
  selector:
    app: doom
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30001
